profile_name: "פרופיל ברירת מחדל - בחירות 2026"
description: "פרופיל עמדות הליבה לניתוח מפלגות ומועמדים לכנסת ה-26"
version: "1.0.0"

topics:
  - id: "education"
    title: "חינוך"
    weight: 1.0
    desired_stance: "התאמה של צורת הלימוד וחומר הלימוד לתקופה, השקעה במורים (הכשרה, שכר, הבאת מורים מעולים). דרישה של תכנית ממשלתית בכל ביה״ס שמקבל תקצוב ממשלתי או עירוני. חינוך מותאם יותר לצרכי הילדים השונים."
    checklist:
      - "התאמת תוכניות לימוד ומיומנויות לתקופה (טכנולוגיה, מדעים, שפות, חשיבה ביקורתית)"
      - "מעמד המורה, שכר תחרותי, הכשרה מתקדמת ומשיכת כוח אדם מעולה להוראה"
      - "תנאי סף של לימודי ליבה/תכנית ממשלתית בכל בית ספר המתוקצב ע״י המדינה או הרשות"
      - "ביזור סמכויות פדגוגיות וניהוליות למנהלי בתי ספר והתאמה לצרכי התלמיד"

  - id: "governance_reform"
    title: "שינוי במערכת השלטון"
    weight: 1.0
    desired_stance: "ביזור, יותר אחריות לשלטון מקומי, חיזוק של כנסת יחסית לממשלה ויחסית למערכת המשפט. פתרון סוגיית הרשות השופטת. פיזור סמכויות של יועמ״ש. להתאים מערכת השלטון, בחירות למצב וגודל של מדינת ישראל מצד אחד ולתקופה וטכנולוגיה מהצד השני. השקעה באקדמיה."
    checklist:
      - "ביזור סמכויות והעברת תקציבים ואחריות לשלטון המקומי והאזורי"
      - "חיזוק יכולות הפיקוח והחקיקה של הכנסת מול הרשות המבצעת"
      - "פתרון מאוזן ומוסכם לסוגיית הרשות השופטת והיחסים בין הרשויות"
      - "פיצול/פיזור סמכויות מוסד היועץ המשפטי לממשלה"
      - "התאמת שיטת הממשל והבחירות למציאות המודרנית והטכנולוגית"
      - "השקעה באקדמיה, במחקר מדעי ובחופש אקדמי"

  - id: "future_infrastructure"
    title: "בניית תשתית להצלחה של מדינת ישראל בדור הקרוב"
    weight: 1.0
    desired_stance: "השקעה במדע, רובוטיקה, חלל, קוונטום, אנרגיה, מים, תשתיות."
    checklist:
      - "השקעה במו״פ לאומי מתקדם: מדע, בינה מלאכותית, רובוטיקה, חלל וקוונטום"
      - "תשתיות אנרגיה מודרניות, ביטחון אנרגטי וגיוון מקורות"
      - "שדרוג משק המים והובלת טכנולוגיות התפלה ומיחזור"
      - "תשתיות תחבורה מתקדמות, הסעת המונים וחיבור הפריפריה"

  - id: "strategic_posture"
    title: "בניית מצב אסטרטגי משופר למדינת ישראל"
    weight: 1.0
    desired_stance: "מעגלים נרחבים של שת״פ אזרחי ובטחוני, הסכמים צבאיים, הצעה קונקרטית לפתרון הסוגייה הפלסטינית ללא מסירת שטחים נרחבים וירושלים (אפשרי בצורה מדודה אבל לא קווי 67). פתרון להתמודדות עם אנטיציונות ופלסטיניזציה של העולם המערבי."
    checklist:
      - "הרחבת הסכמי אברהם ושותפויות אזוריות ובינלאומיות ביטחוניות ואזרחיות"
      - "בריתות והסכמי הגנה ושיתוף פעולה צבאי אסטרטגי"
      - "הצעה קונקרטית ומפוכחת לסוגיה הפלסטינית ללא ויתור על שטחים נרחבים או ירושלים"
      - "אסטרטגיה לאומית ומערכתית למאבק באנטי-ציונות ובדה-לגיטימציה במערב"

  - id: "religion_and_state"
    title: "דת ומדינה"
    weight: 1.0
    desired_stance: "גישה זהירה שמאפשרת לרשויות מקומיות יותר חופש ולמדינה הגדרה של כללים מנחים."
    checklist:
      - "הענקת אוטונומיה לרשויות מקומיות בקביעת אופי המרחב הציבורי (שבת, מסחר, תחבורה)"
      - "הגדרת עקרונות ממלכתיים מחייבים ומניעת כפייה דתית או חילונית"
      - "קידום פתרונות מוסכמים בנושאי נישואין, גיור וכשרות"
      - "שוויון בנטל השירות והחובות האזרחיות"

  - id: "returning_residents"
    title: "תכנית להחזרה של יורדים"
    weight: 1.0
    desired_stance: "תכנית להחזרה של יורדים, במיוחד רופאים, מדענים ויזמים."
    checklist:
      - "תמריצים ומענקים ממוקדים להחזרת רופאים, מדענים וחוקרים אקדמיים"
      - "הקלות מס ורגולציה לחזרת יזמים טכנולוגיים ובעלי הון אנושי גבוה"
      - "הסרת חסמים בירוקרטיים בהכרה ברישיונות ובתארים"
      - "רשת תמיכה והשמה מוסדית לקליטה מהירה במשק ובמערכת הבריאות והאקדמיה"

  - id: "open_market"
    title: "שוק פתוח, יזמות, הורדת חסמים"
    weight: 1.0
    desired_stance: "שוק פתוח, יזמות, הורדת חסמים."
    checklist:
      - "פתיחת השוק לייבוא חופשי ואימוץ תקינה בינלאומית מוכרת"
      - "פירוק מונופולים, קרטלים והפחתת הריכוזיות במשק"
      - "צמצום רגולציה מכבידה ועידוד יזמות ועסקים קטנים ובינוניים"
      - "הפחתת נטל מסים מעוותים וייעול שירותי ממשלה לעסקים"

  - id: "welfare_reform"
    title: "סידור מחדש של העברות"
    weight: 1.0
    desired_stance: "מצד אחד לאפשר לאנשים שאינם מסוגלים להתפרנס לחיות בכבוד מצד שני לא לקדם התנהגויות שמובילות לעוני, חוסר חינוך ובטלה, לא לאפשר לחיות על חשבון המערכת לאוכלוסיות שלמות ולהוריד כמות האנשים שמועסקים בחלוקה."
    checklist:
      - "הבטחת קיום בכבוד לקשישים, נכים ומי שאינם מסוגלים להתפרנס"
      - "שלילת תמריצים כלכליים המעודדים בטלה, עוני והיעדר השכלה"
      - "התניית הטבות וסבסודים במיצוי כושר השתכרות ולימודי ליבה"
      - "צמצום מנגנוני הפקידות המועסקים בחלוקת תקציבים ומניעת כספים קואליציוניים מגזריים"

  - id: "government_downsizing"
    title: "צמצום הממשלה"
    weight: 1.0
    desired_stance: "צמצום הממשלה - גם במספר השרים, משרדי ממשלה וגם בגודל המשרדים."
    checklist:
      - "הגבלת מספר שרי הממשלה (למשל עד 18 שרים) וביטול מוחלט של שרים ללא תיק"
      - "סגירת משרדי ממשלה מיותרים ואיחוד אגפים ותפקידים כפולים"
      - "קיצוץ והתייעלות במצבת כוח האדם של מנגנוני המטה והביורוקרטיה"
      - "חיסכון דרמטי בהוצאות התפעול והלשכות של נבחרי הציבור"
