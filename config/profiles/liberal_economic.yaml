profile_name: "שוק חופשי וממשלה רזה (Liberal-Economic)"
description: "פרופיל ליברלי-כלכלי המתמקד בהסרת חסמים ורגולציה, הפחתת מסים, צמצום משמעותי של הממשלה, רפורמה מקיפה בקצבאות ועידוד תעסוקה, וחיזוק החינוך המדעי-טכנולוגי."
version: "1.0.0"

topics:
  - id: "open_market"
    title: "שוק פתוח, יזמות, הורדת חסמים"
    weight: 2.0
    desired_stance: "שוק חופשי מלא, פתיחה מוחלטת לייבוא ללא מכסים ואימוץ תקינה אירופית/אמריקאית ('מה שטוב לאירופה טוב לישראל'), פירוק מונופולים וקרטלים, הפחתת נטל מס חברות ומס הכנסה, וצמצום רגולציה מכבידה על עסקים קטנים ובינוניים."
    checklist:
      - "פתיחת השוק לייבוא חופשי ללא מכסים ומכסות חקלאיות"
      - "פירוק מונופולים, קרטלים וועדי עובדים חוסמים במשק"
      - "הפחתת מסים ישירים ועקיפים לעידוד השקעות וצמיחה"
      - "ביטול רגולציות ורישיונות עסק מיותרים"

  - id: "government_downsizing"
    title: "צמצום הממשלה"
    weight: 2.0
    desired_stance: "ממשלה רזה ויעילה: מקסימום 18 משרדים, סגירה מיידית של משרדים מומצאים ומגזריים, קיצוץ תקנים ביורוקרטיים, והפרטה של חברות ממשלתיות ושירותים שאינם בליבת הריבונות."
    checklist:
      - "הגבלת מספר השרים ל-18 לכל היותר וביטול משרדים מומצאים"
      - "סגירה ואיחוד של משרדי ממשלה מיותרים"
      - "קיצוץ תקני כוח אדם בשירות המדינה וייעול דיגיטלי"
      - "הפרטת חברות ממשלתיות ונמלים"

  - id: "welfare_reform"
    title: "סידור מחדש של העברות"
    weight: 1.8
    desired_stance: "הפסקת מדיניות הרווחה המנציחה עוני ותלות. קצבאות אך ורק למי שאינו מסוגל לעבוד (נכים, קשישים סיעודיים). התניית כל סיוע ממשלתי אחר ביציאה לעבודה ובלימודי ליבה, וביטול מוחלט של כספים קואליציוניים מגזריים."
    checklist:
      - "התניית קצבאות והנחות (מעונות, ארנונה) במיצוי כושר השתכרות של שני בני הזוג"
      - "שלילת תקצוב ממוסדות שאינם מלמדים לימודי ליבה מלאים ועומדים במבחנים חיצוניים"
      - "הבטחת קיום בכבוד לנכים וקשישים חסרי יכולת תוך מניעת תרמית והונאה"
      - "ביטול מוחלט של כספים קואליציוניים ותקציבים סקטוריאליים"

  - id: "future_infrastructure"
    title: "בניית תשתית להצלחה של מדינת ישראל בדור הקרוב"
    weight: 1.5
    desired_stance: "השקעה ממוקדת במחוללי צמיחה לאומיים: בינה מלאכותית, מחשוב קוונטי, רובוטיקה, אנרגיה ירוקה ותשתיות מים ותחבורה מהירה, תוך שיתוף המגזר הפרטי (PPP)."
    checklist:
      - "השקעה במו״פ עמוק (Deep Tech): AI, קוונטום, רובוטיקה וחלל"
      - "מודלים של שיתוף פעולה ציבורי-פרטי (PPP/BOT) לפיתוח תשתיות"
      - "ביטחון אנרגטי ופיתוח משק אנרגיה מבוזר ותחרותי"
      - "רכבות מהירות ומערכות הסעת המונים לחיבור גליל ונגב למרכז"

  - id: "education"
    title: "חינוך"
    weight: 1.2
    desired_stance: "התאמת החינוך למאה ה-21: אוטונומיה ניהולית מלאה למנהלי בתי ספר, מעבר לשיטת שוברים (Vouchers) להגברת התחרות בין בתי ספר, תגמול דיפרנציאלי למורים מצטיינים במקצועות נדרשים, וחובת לימודי ליבה כתנאי לכל תקציב."
    checklist:
      - "חובת לימודי ליבה (מתמטיקה, אנגלית, מדעים) בכל מוסד מתוקצב"
      - "אוטונומיה ניהולית ותקציבית למנהלי בתי ספר"
      - "שכר דיפרנציאלי וחוזים אישיים למורים מצטיינים"
      - "גיוון פדגוגי ותחרות בין מוסדות חינוך"

  - id: "governance_reform"
    title: "שינוי במערכת השלטון"
    weight: 1.2
    desired_stance: "ביזור סמכויות מסיבי מהשלטון המרכזי לשלטון המקומי, איזון נכון בין רשויות השלטון ללא עריצות פקידותית או פוליטית, פיצול סמכויות היועמ״ש לתובע כללי ויועץ לממשלה, והגברת השקיפות והאחריותיות של נבחרי הציבור."
    checklist:
      - "ביזור סמכויות וניהול תקציבי עצמאי לרשויות מקומיות חזקות"
      - "פיצול תפקיד היועץ המשפטי לממשלה לתובע כללי ויועץ משפטי"
      - "חקיקת חוק יסוד: החקיקה להסדרת היחסים בין הכנסת לבג״ץ"
      - "הגברת סמכויות הפיקוח של ועדות הכנסת על משרדי הממשלה"

  - id: "strategic_posture"
    title: "בניית מצב אסטרטגי משופר למדינת ישראל"
    weight: 1.0
    desired_stance: "עוצמה ביטחונית הנשענת על כלכלה חזקה, הרחבת מעגל השלום האזורי (הסכמי אברהם) על בסיס אינטרסים כלכליים וביטחוניים משותפים, שימור עליונות צבאית וטכנולוגית, ומאבק בלתי מתפשר באנטישמיות ובאנטי-ציונות בעולם."
    checklist:
      - "הרחבת הסכמי אברהם לנרמול יחסים אזורי המבוסס על שגשוג כלכלי"
      - "חיזוק תעשיות הביטחון והחדשנות הצבאית"
      - "שמירה על גבולות בני הגנה וירושלים המאוחדת"
      - "מערכה גלובלית מתואמת נגד דה-לגיטימציה וקמפייני חרם"

  - id: "religion_and_state"
    title: "דת ומדינה"
    weight: 1.0
    desired_stance: "חופש מדת וחופש לדת על בסיס עקרון 'חיה ותן לחיות': אוטונומיה לרשויות מקומיות בקביעת אופי השבת והתחבורה הציבורית, פתיחת שוק הכשרות לתחרות חופשית, קידום נישואין אזרחיים או ברית זוגיות, ושוויון מלא בנטל השירות והתעסוקה."
    checklist:
      - "אוטונומיה מוניציפלית בנושאי תחבורה ומסחר בשבת"
      - "פתיחת שוק הכשרות והגיור לתחרות מבוקרת"
      - "הסדרת ברית זוגיות ונישואין אזרחיים"
      - "גיוס שוויוני או שירות לאומי/אזרחי לכלל המגזרים"

  - id: "returning_residents"
    title: "תכנית להחזרה של יורדים"
    weight: 1.0
    desired_stance: "יצירת סביבה עסקית, מדעית ורפואית אטרקטיבית שתמשוך ישראלים לחזור: הטבות מס ממוקדות לחוקרים, רופאים ויזמים, הכרה אוטומטית בתארים ורישיונות זרים מובילים, והסרת כל חסם ביורוקרטי בכניסה לשוק העבודה הישראלי."
    checklist:
      - "חבילות תמריצי מס והקלות מכס לחוזרים בתחומי רפואה והייטק"
      - "הכרה מהירה ואוטומטית בהסמכות ותארים ממוסדות בינלאומיים מובילים"
      - "יצירת תקני מחקר ותשתיות מעבדה מתקדמות באקדמיה ובבתי החולים"
      - "פלטפורמה ממשלתית דיגיטלית להשמה ישירה של חוזרים במשק"
